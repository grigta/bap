pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{ts,js}"
      run: pnpm exec eslint {staged_files}
    - name: markdownlint
      glob: "*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
    - name: docs-check
      glob: "docs/**"
      run: pnpm docs:check

pre-push:
  jobs:
    # full `pnpm verify` also needs Linken Sphere running; run it at the end of a stage.
    # Once per change: skipped when this exact code already passed `pnpm verify:code` (tools/verify-once).
    - name: verify
      run: node tools/verify-once/src/cli.ts check || pnpm verify:code
