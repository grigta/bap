pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{ts,js}"
      run: pnpm exec eslint {staged_files}
    - name: markdownlint
      glob: "*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
    - name: docs-check
      glob: "docs/**"
      run: pnpm docs:check

pre-push:
  jobs:
    # A few minutes: lint, types, unit tests, and the integration/e2e tests of what changed (tools/verify-push).
    # The full `pnpm verify:code` runs in CI on every push; full `pnpm verify` (needs Linken Sphere) at the end of a stage.
    - name: verify
      run: pnpm verify:push
